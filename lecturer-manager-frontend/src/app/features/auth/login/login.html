<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-4">Logowanie studenta</h2>

    @if (errorMessage()) {
      <div class="alert alert-danger" role="alert">{{ errorMessage() }}</div>
    }

    <form (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-3">
        <label for="login" class="form-label">Login</label>
        <input
          id="login"
          type="text"
          class="form-control"
          [ngModel]="login()"
          (ngModelChange)="login.set($event)"
          name="login"
          required
          maxlength="100"
          placeholder="Wpisz login"
          aria-required="true"
          autocomplete="username"
        />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Hasło</label>
        <input
          id="password"
          type="password"
          class="form-control"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          required
          maxlength="200"
          placeholder="Wpisz hasło"
          aria-required="true"
          autocomplete="current-password"
        />
      </div>

      <div class="d-flex gap-2 mt-4">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="isSaving() || !login().trim() || !password().trim()"
          aria-label="Zaloguj się"
        >
          @if (isSaving()) {
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Logowanie…
          } @else {
            Zaloguj się
          }
        </button>

        <a routerLink="/register" class="btn btn-outline-secondary" aria-label="Przejdź do rejestracji">
          Rejestracja
        </a>
      </div>
    </form>
  </div>
</div>
