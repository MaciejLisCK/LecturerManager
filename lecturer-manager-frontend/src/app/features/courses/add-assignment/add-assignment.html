<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-4">Dodaj zadanie</h2>

    @if (errorMessage()) {
      <div class="alert alert-danger" role="alert">{{ errorMessage() }}</div>
    }

    <form (ngSubmit)="onSubmit()" #assignmentForm="ngForm">
      <div class="mb-3">
        <label for="assignmentName" class="form-label">Nazwa zadania</label>
        <input
          id="assignmentName"
          type="text"
          class="form-control"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
          name="name"
          required
          maxlength="300"
          placeholder="Wpisz nazwę zadania"
          aria-required="true"
        />
      </div>

      <div class="d-flex gap-2">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="isSaving() || !name().trim()"
          aria-label="Zapisz zadanie"
        >
          @if (isSaving()) {
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Zapisywanie…
          } @else {
            Zapisz
          }
        </button>
        <a [routerLink]="['/courses', courseId()]" class="btn btn-outline-secondary" aria-label="Anuluj i wróć do kursu">Anuluj</a>
      </div>
    </form>
  </div>
</div>
