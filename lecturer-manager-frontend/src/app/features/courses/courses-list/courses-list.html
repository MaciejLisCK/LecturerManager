<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Zajęcia</h2>
  <a class="btn btn-primary" routerLink="/courses/add">Dodaj zajęcia</a>
</div>
<table class="table table-striped table-hover">
  <thead>
    <tr>
      <th>Nazwa</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (course of coursesResource.value() ?? []; track course.id) {
      <tr>
        <td>
          <a [routerLink]="['/courses', course.id]" class="text-decoration-none">{{ course.name }}</a>
        </td>
        <td class="text-end">
          <button
            class="btn btn-sm btn-outline-danger"
            (click)="deleteCourse(course.id)"
            [attr.aria-label]="'Usu\u0144 kurs ' + course.name"
          >
            Usuń
          </button>
        </td>
      </tr>
    }
  </tbody>
</table>
