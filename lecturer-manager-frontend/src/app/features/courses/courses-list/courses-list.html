<table class="table table-striped table-hover">
  <thead>
    <tr>
      <th>Nazwa</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (course of coursesResource.value() ?? []; track course.id) {
      <tr>
        <td>{{ course.name }}</td>
        <td class="text-end">
          <a
            class="btn btn-sm btn-outline-primary me-2"
            [routerLink]="['/courses', course.id, 'assignments', 'add']"
            [attr.aria-label]="'Dodaj zadanie do kursu ' + course.name"
          >
            Dodaj zadanie
          </a>
          <button
            class="btn btn-sm btn-outline-danger"
            (click)="deleteCourse(course.id)"
            [attr.aria-label]="'Usu\u0144 kurs ' + course.name"
          >
            Usuń
          </button>
        </td>
      </tr>
    }
  </tbody>
</table>
